# PearlLMS production deploy (Shape A: DigitalOcean droplet + docker compose + Caddy).
#
# Runs dashboard + api + jobs + Redis on one droplet, fronted by Caddy for automatic
# HTTPS (Let's Encrypt). Postgres and object storage are EXTERNAL (Supabase) — there is
# no local postgres/minio here. All values come from a droplet-side `.env` (gitignored);
# see .env.deploy.example and docs/DEPLOY.md. Build is from source so the deployed code
# equals the pushed source (AGPL sync rule).
#
#   docker compose -f docker-compose.deploy.yaml up -d --build
#
# Build one image at a time on this small droplet: COMPOSE_PARALLEL_LIMIT=1 docker compose ... up -d --build
# (docs/DEPLOY.md, "Build memory"). Migrations run in the one-shot `migrate` service; api and dashboard wait for it.

# Cap container logs (json-file is unbounded by default and can fill the droplet disk).
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  redis:
    image: redis:7-alpine
    container_name: pearl-redis
    # maxmemory sits under the container limit; noeviction is required by BullMQ (docs/DEPLOY.md, memory limits).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '400mb', '--maxmemory-policy', 'noeviction']
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *logging
    restart: unless-stopped

  # One-shot migrator: the api image running db:setup (roles, migrations over the direct 5432 connection, essential seed),
  # then exiting. api and dashboard start only after it exits 0, so a failing migration never produces a crash-looping
  # new api (the previous api container keeps serving). Re-run by hand: `docker compose -f docker-compose.deploy.yaml run --rm migrate`
  migrate:
    image: pearl-api:local
    # Built by the `api` service below; never try to pull the local tag.
    pull_policy: never
    container_name: pearl-migrate
    entrypoint: ['pnpm', '--filter', '@cio/db', 'db:setup']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set the Supabase transaction-pooler URL (6543)}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:?set the Supabase direct/session URL (5432) for migrations}
      MIGRATION_LOCK_TIMEOUT: ${MIGRATION_LOCK_TIMEOUT:-}
      MIGRATION_STATEMENT_TIMEOUT: ${MIGRATION_STATEMENT_TIMEOUT:-}
    logging: *logging
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: pearl-api:local
    container_name: pearl-api
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3081/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      NODE_ENV: production
      PORT: 3081
      PUBLIC_IS_SELFHOSTED: 'true'
      # Public app URL (https). Used for auth baseURL, email links, trusted origins.
      PUBLIC_SERVER_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL to your https app URL}
      DASHBOARD_ORIGIN: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      TRUSTED_ORIGINS: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      # Supabase Postgres: runtime over the TRANSACTION POOLER (6543); the api entrypoint
      # `migrate` service runs db:setup migrations over the DIRECT/session connection (5432) — both required.
      DATABASE_URL: ${DATABASE_URL:?set the Supabase transaction-pooler URL (6543)}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:?set the Supabase direct/session URL (5432) for migrations}
      REDIS_URL: redis://redis:6379
      # Supabase Storage (S3-compatible)
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
      OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      OBJECT_STORAGE_BUCKET_VIDEOS: ${OBJECT_STORAGE_BUCKET_VIDEOS:-videos}
      OBJECT_STORAGE_BUCKET_DOCUMENTS: ${OBJECT_STORAGE_BUCKET_DOCUMENTS:-documents}
      OBJECT_STORAGE_BUCKET_MEDIA: ${OBJECT_STORAGE_BUCKET_MEDIA:-media}
      OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL: ${OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL:?}
      # Real SMTP (production)
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:?}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:?}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      # Auth secrets — generate strong random values (openssl rand -hex 32); see docs/DEPLOY.md
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generate a strong BETTER_AUTH_SECRET}
      PRIVATE_SERVER_KEY: ${PRIVATE_SERVER_KEY:?generate a strong PRIVATE_SERVER_KEY}
      # Migrations, roles and the essential seed already ran in the `migrate` service this container waits for.
      SKIP_DB_SETUP: 'true'
      # K4 starting points (connection budget in docs/DEPLOY.md). The pool stays at the code default of 10 until the
      # Supabase pooler pool_size is checked; the heap sits under the container mem_limit below.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=576}
      # K6 error tracking: OFF unless both SENTRY_DSN and SENTRY_ENABLED=true are set. No PII is sent.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      # Phase J tuning/flags: all optional, empty = built-in default (see docs/ENV.md).
      SHUTDOWN_TIMEOUT: ${API_SHUTDOWN_TIMEOUT:-}
      REPORT_STATEMENT_TIMEOUT_MS: ${REPORT_STATEMENT_TIMEOUT_MS:-}
      SYSTEM_EVENT_THROTTLE_WINDOW_MS: ${SYSTEM_EVENT_THROTTLE_WINDOW_MS:-}
      COHORT_GOAL_REMINDER_EMAILS_ENABLED: ${COHORT_GOAL_REMINDER_EMAILS_ENABLED:-}
    mem_limit: ${API_MEM_LIMIT:-768m}
    # Let in-flight requests finish on redeploy: SHUTDOWN_TIMEOUT (25s drain) + pool close fits inside 60s.
    stop_grace_period: 60s
    logging: *logging
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      args:
        # PUBLIC_IS_SELFHOSTED is baked into the client bundle at build time.
        PUBLIC_IS_SELFHOSTED: 'true'
    container_name: pearl-dashboard
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    # Cheap TCP check (the SSR `/` route does session + api work every time). Lets caddy wait for a listening dashboard.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(3082,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3082
      PUBLIC_IS_SELFHOSTED: 'true'
      # SvelteKit adapter-node buffers proxied request bodies and rejects anything over its default 512KB
      # limit BEFORE the request reaches the api — this is what blocks server-proxied media uploads
      # (cover-image crop / logos / avatars via /proxy/media/image). Raise it above the api image limit
      # (UPLOAD_MAX_IMAGE_MB, default 5MB) with headroom for multipart overhead. Value in bytes.
      BODY_SIZE_LIMIT: ${DASHBOARD_BODY_SIZE_LIMIT:-26214400}
      # SvelteKit CSRF origin = the public https URL.
      ORIGIN: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      # Real visitor IP for getClientAddress() (e.g. the registration limiter): trust the single X-Forwarded-For hop
      # Caddy appends. Without these it returns Caddy's container IP, so every visitor shares one bucket.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      # SSR proxy target for /proxy/* and /api/auth/* — the api over the internal network.
      PRIVATE_SERVER_URL: http://api:3081
      PRIVATE_SERVER_KEY: ${PRIVATE_SERVER_KEY:?}
      # AGPL "Source code" link target (runtime).
      PUBLIC_SOURCE_REPO_URL: ${PUBLIC_SOURCE_REPO_URL:-https://github.com/Integer-Training/LMSclassroom}
      # CSP: self-hosted starts from 'self' only. Allow the Supabase Storage host so browser
      # presigned uploads/downloads (connect-src) and public media images (img/media-src) work.
      CSP_CONNECT_SRC_DOMAINS: ${CSP_CONNECT_SRC_DOMAINS:-}
      CSP_MEDIA_SRC_DOMAINS: ${CSP_MEDIA_SRC_DOMAINS:-}
      # adapter-node: seconds to wait for in-flight requests after SIGTERM before exiting.
      SHUTDOWN_TIMEOUT: '30'
      NODE_OPTIONS: ${DASHBOARD_NODE_OPTIONS:---max-old-space-size=576}
      # K6 browser error tracking: OFF unless both PUBLIC_SENTRY_DSN and PUBLIC_SENTRY_ENABLED=true are set
      # (also add the Sentry ingest host to CSP_CONNECT_SRC_DOMAINS or the browser blocks the reports).
      PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
      PUBLIC_SENTRY_ENABLED: ${PUBLIC_SENTRY_ENABLED:-}
      PUBLIC_SENTRY_ENVIRONMENT: ${PUBLIC_SENTRY_ENVIRONMENT:-}
      PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}
    mem_limit: ${DASHBOARD_MEM_LIMIT:-768m}
    stop_grace_period: 60s
    logging: *logging
    restart: unless-stopped

  jobs:
    build:
      context: .
      dockerfile: docker/Dockerfile.jobs
    container_name: pearl-jobs
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL:?}
      # Own knob so api and jobs are budgeted separately (docs/DEPLOY.md); default = the code default of 10.
      DATABASE_POOL_MAX: ${JOBS_DATABASE_POOL_MAX:-10}
      # Heap stays well under mem_limit: ffmpeg/Whisper child processes need the rest.
      NODE_OPTIONS: ${JOBS_NODE_OPTIONS:---max-old-space-size=512}
      # Worker concurrencies: empty = built-in default (media 2, transcribe 1, course generation 1).
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-}
      TRANSCRIBE_WORKER_CONCURRENCY: ${TRANSCRIBE_WORKER_CONCURRENCY:-}
      AGENT_COURSE_GENERATION_WORKER_CONCURRENCY: ${AGENT_COURSE_GENERATION_WORKER_CONCURRENCY:-}
      # Supabase Storage (mirrors api)
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
      OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      OBJECT_STORAGE_BUCKET_VIDEOS: ${OBJECT_STORAGE_BUCKET_VIDEOS:-videos}
      OBJECT_STORAGE_BUCKET_DOCUMENTS: ${OBJECT_STORAGE_BUCKET_DOCUMENTS:-documents}
      OBJECT_STORAGE_BUCKET_MEDIA: ${OBJECT_STORAGE_BUCKET_MEDIA:-media}
      OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL: ${OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL:?}
      # Real SMTP
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:?}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:?}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Phase J flags: all optional, empty = built-in default (see docs/ENV.md). Each retention purge can be switched off.
      SHUTDOWN_TIMEOUT: ${JOBS_SHUTDOWN_TIMEOUT:-}
      FFMPEG_TIMEOUT_MS: ${FFMPEG_TIMEOUT_MS:-}
      RETENTION_PURGES_ENABLED: ${RETENTION_PURGES_ENABLED:-}
      RETENTION_SESSIONS_ENABLED: ${RETENTION_SESSIONS_ENABLED:-}
      RETENTION_VERIFICATIONS_ENABLED: ${RETENTION_VERIFICATIONS_ENABLED:-}
      RETENTION_NOTIFICATIONS_ENABLED: ${RETENTION_NOTIFICATIONS_ENABLED:-}
      RETENTION_DEAD_LETTER_ENABLED: ${RETENTION_DEAD_LETTER_ENABLED:-}
      RETENTION_ANALYTICS_EVENTS_ENABLED: ${RETENTION_ANALYTICS_EVENTS_ENABLED:-}
      RETENTION_JOB_RECORDS_ENABLED: ${RETENTION_JOB_RECORDS_ENABLED:-}
      COMPLIANCE_EXPIRY_SCAN_ENABLED: ${COMPLIANCE_EXPIRY_SCAN_ENABLED:-}
      COMPLIANCE_REMINDER_SCAN_ENABLED: ${COMPLIANCE_REMINDER_SCAN_ENABLED:-}
    mem_limit: ${JOBS_MEM_LIMIT:-1200m}
    cpus: ${JOBS_CPUS:-1.0}
    # An ffmpeg/Whisper job can run for many minutes: give the workers time to finish (or hand back) on redeploy.
    stop_grace_period: 300s
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: pearl-caddy
    depends_on:
      dashboard:
        condition: service_healthy
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Caddy issues/renews a Let's Encrypt cert for this domain automatically.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN to your domain, e.g. lms.example.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
  caddy-config:
